models:
  - name: fct_customer_lifetime_value
    description: "One row per customer showing lifetime spend, order behaviour, and favourite product type."
    columns:
      - name: customer_id
        description: "Primary key - unique customer identifier"
        tests:
          - unique
          - not_null
      - name: customer_name
        description: "Customer full name"
      - name: total_orders
        description: "Total number of orders placed by the customer"
        tests:
          - not_null
      - name: lifetime_value
        description: "Total revenue generated by the customer in dollars"
      - name: avg_order_value
        description: "Average spend per order in dollars"
      - name: first_order_date
        description: "Date of the customer's first order"
      - name: last_order_date
        description: "Date of the customer's most recent order"
      - name: favourite_product_type
        description: "The product type the customer has purchased most frequently"
        tests:
          - accepted_values:
              arguments:
                values: ['beverage', 'food', 'jaffle']